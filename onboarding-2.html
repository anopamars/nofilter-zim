<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How it works — No Filter Zim</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, #0d0015 0%, #0a0a0a 70%);
      z-index: 0;
    }
    .bar {
      position: fixed;
      left: 0; right: 0;
      height: 55px;
      background: #000;
      z-index: 2;
    }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 400px;
      width: 100%;
      animation: up 0.5s ease forwards;
    }
    @keyframes up {
      from { opacity:0; transform:translateY(16px); }
      to { opacity:1; transform:translateY(0); }
    }
    .icon {
      font-size: 5rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-12px)}
    }
    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 0.75rem;
    }
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2.4rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--white);
      margin-bottom: 1rem;
    }
    .headline em { color: var(--purple); font-style: normal; }
    .body {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .pills {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .pill {
      background: #111;
      border: 0.5px solid #1a1a1a;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.78rem;
      color: #666;
    }
    .pill strong { color: var(--white); font-family: 'Syne', sans-serif; font-weight: 700; }
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .dot { width:6px; height:6px; border-radius:3px; background:#222; transition:all 0.3s; }
    .dot.active { background:var(--red); width:24px; }
    .btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 16px 32px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      width: 100%;
      display: block;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
    }
    .btn:hover { background: #e02020; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <div class="content">
    <span class="icon">🔗</span>
    <div class="eyebrow">How it works</div>
    <div class="headline">Share your link.<br><em>Brace yourself.</em></div>
    <div class="body">
      Create your profile. Activate your 24-hour link.
      Post it. Your followers answer anonymously.
      AI turns their answers into one brutal roast card.
    </div>
    <div class="pills">
      <div class="pill"><strong>24hrs</strong> only</div>
      <div class="pill"><strong>100%</strong> anonymous</div>
      <div class="pill"><strong>AI</strong> powered</div>
      <div class="pill"><strong>Zim</strong> built</div>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <a href="onboarding-3.html" class="btn">Next →</a>
  </div>
</body>
</html>
