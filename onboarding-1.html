<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome — No Filter Zim</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  overflow-y: auto !important;
}
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, #1a0000 0%, #0a0a0a 70%);
      z-index: 0;
    }
    .bar {
      position: fixed;
      left: 0; right: 0;
      height: 55px;
      background: #000;
      z-index: 2;
    }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; }
    .scanline {
      position: fixed;
      inset: 0;
      height: 2px;
      background: rgba(255,45,45,0.12);
      animation: scan 4s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    @keyframes scan { from{top:0} to{top:100%} }
    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 400px;
      width: 100%;
      animation: up 0.5s ease forwards;
    }
    @keyframes up {
      from { opacity:0; transform:translateY(16px); }
      to { opacity:1; transform:translateY(0); }
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      color: var(--white);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: up 0.6s ease 0.2s forwards;
    }
    .logo span { color: var(--red); }
    .icon {
      font-size: 5rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-12px)}
    }
    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 0.75rem;
    }
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2.4rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
      color: var(--white);
      margin-bottom: 1rem;
    }
    .headline em { color: var(--red); font-style: normal; }
    .body {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 3px;
      background: #222;
      transition: all 0.3s;
    }
    .dot.active { background: var(--red); width: 24px; }
    .btn {
      background: var(--red);
      color: white;
      border: none;
      padding: 16px 32px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 4px;
      width: 100%;
      display: block;
      text-align: center;
      text-decoration: none;
      transition: transform 0.15s, background 0.15s;
      cursor: pointer;
    }
    .btn:hover { background: #e02020; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="scanline"></div>
  <div class="bar top"></div>
  <div class="bar bottom"></div>

  <div class="content">
    <div class="logo">no<span>filter</span> <span style="color:#555;font-size:0.85rem;">zim</span></div>
    <span class="icon">💀</span>
    <div class="eyebrow">Zimbabwe's most brutal app</div>
    <div class="headline">What do people <em>really</em> think of you?</div>
    <div class="body">
      Not what they say to your face.<br>
      What they say behind your back.
    </div>
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <a href="onboarding-2.html" class="btn">Get started →</a>
  </div>
</body>
</html>
